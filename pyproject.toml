[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vai"
version = "1.0.0"
description = "VAI - Valorant Agent Instalock Helper (Passive DWM Alignment Overlay)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[project.scripts]
vai = "val_overlay.main:main"
val-reticle-overlay = "val_overlay.main:main"

[tool.setuptools.packages.find]
where = ["src"]

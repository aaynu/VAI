name: Release Lifecycle & Installer Build

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    name: Build Installer & Publish Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyinstaller

      - name: Run Test Suite
        shell: pwsh
        run: |
          pytest -v

      - name: Build Standalone Executable with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconsole --onefile --name "VAI" --paths src src/val_overlay/main.py

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Extract Version from Tag
        id: version_info
        shell: pwsh
        run: |
          $rawTag = "${{ github.ref_name }}"
          $cleanVersion = $rawTag.TrimStart('v')
          "version=$cleanVersion" >> $env:GITHUB_OUTPUT
          "tag=$rawTag" >> $env:GITHUB_OUTPUT

      - name: Compile Windows Setup Installer (Inno Setup)
        shell: pwsh
        run: |
          $ver = "${{ steps.version_info.outputs.version }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="$ver" installer/installer.iss

      - name: Determine Release Status (Stable vs Beta)
        id: release_info
        shell: pwsh
        run: |
          $tag = "${{ steps.version_info.outputs.tag }}"
          # Major versions ending in .0 or .0.0 are Stable; incremental versions are Beta
          if ($tag -match '^v?[0-9]+\.0(\.0)?$' -or $tag -match '-stable$') {
            "is_prerelease=false" >> $env:GITHUB_OUTPUT
            "title_suffix=(Stable Release)" >> $env:GITHUB_OUTPUT
            "badge=> [!NOTE]`n> **Stable Release**: Verified production build.`n" >> $env:GITHUB_OUTPUT
          } else {
            "is_prerelease=true" >> $env:GITHUB_OUTPUT
            "title_suffix=(Beta Release)" >> $env:GITHUB_OUTPUT
            "badge=> [!WARNING]`n> **Beta / Pre-Release**: Incremental build undergoing testing.`n" >> $env:GITHUB_OUTPUT
          }

      - name: Generate Release Notes
        id: notes
        shell: pwsh
        run: |
          $ver = "${{ steps.version_info.outputs.version }}"
          $badge = "${{ steps.release_info.outputs.badge }}"
          
          $notes = @"
          $badge
          
          ### 🎮 VAI - Valorant Agent Instalock Helper v$ver
          
          A lightweight, passive visual overlay designed to give you instant mouse pre-positioning on Agent Select without triggering Riot Vanguard.
          
          #### 📥 Easy Installation (Non-Technical Users)
          1. Download **`VAI-Setup-v$ver.exe`** from the Assets below.
          2. Run the installer and click **Next** -> **Install**.
          3. Launch **VAI** from your Desktop or Start Menu!
          
          *(Alternative: Download the standalone **`VAI.exe`** for a portable zero-install experience!)*
          
          ---
          
          #### ⌨️ Default Hotkeys
          - **`Ctrl + Shift + F8`**: Toggle overlay visibility (completely detaches from Windows DWM during gameplay for zero input lag).
          - **`Ctrl + Shift + F9`**: Toggle Calibration Mode (drag reticles or nudge with Arrow keys).
          - **`Ctrl + Shift + F10`**: Cycle configured Agent presets (Jett, Clove, Reyna, etc.).
          - **`Ctrl + Shift + F7`**: Cycle target monitor (multi-monitor setups).
          - **`Ctrl + Shift + R`**: Toggle Role Filter waypoint.
          - **`Ctrl + Shift + Q`**: Clean exit.
          
          #### 🛡️ Anti-Cheat & Vanguard Safety
          - **0% Memory Injection / 0% Hooking / 0% Automation**
          - Uses standard Windows DWM transparent overlay rendering (`WS_EX_TRANSPARENT | WS_EX_LAYERED`).
          - All clicks and movements remain 100% human input.
          "@
          
          Set-Content -Path release_notes.md -Value $notes -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: VAI ${{ steps.version_info.outputs.tag }} ${{ steps.release_info.outputs.title_suffix }}
          prerelease: ${{ steps.release_info.outputs.is_prerelease == 'true' }}
          body_path: release_notes.md
          files: |
            dist/VAI-Setup-v${{ steps.version_info.outputs.version }}.exe
            dist/VAI.exe
